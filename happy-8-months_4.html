<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy 8 Months 💗</title>
<style>
  :root{
    --pink-light:#ffe6f0;
    --pink-mid:#ffb6d5;
    --pink-deep:#ff7fb0;
    --pink-text:#8a2f52;
    --cream:#fffaf7;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background:linear-gradient(180deg,var(--pink-light) 0%, #fff0f6 50%, var(--pink-mid) 100%);
    overflow-x:hidden;
  }

  /* ---------- Falling elements ---------- */
  .falling{
    position:fixed;
    top:-10%;
    pointer-events:none;
    user-select:none;
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    z-index:1;
  }
  @keyframes fall{
    0%{transform:translateY(0) rotate(0deg);}
    100%{transform:translateY(110vh) rotate(360deg);}
  }

  /* ---------- Intro screen ---------- */
  #intro{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    z-index:2;
    padding:20px;
  }
  #intro h1{
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight:800;
    font-size:clamp(2.4rem,8vw,4.5rem);
    color:var(--pink-deep);
    text-shadow:2px 2px 0 #fff, 4px 4px 12px rgba(255,127,176,0.35);
    margin:0;
    animation:pop 1.2s ease;
  }
  @keyframes pop{
    0%{transform:scale(0.4);opacity:0;}
    60%{transform:scale(1.08);opacity:1;}
    100%{transform:scale(1);}
  }
  #intro p{
    color:var(--pink-text);
    font-size:1.2rem;
    margin-top:10px;
    opacity:0.85;
  }
  #openBtn{
    margin-top:40px;
    padding:16px 40px;
    font-size:1.1rem;
    border:none;
    border-radius:50px;
    background:linear-gradient(135deg,var(--pink-deep),#ff5c9e);
    color:white;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(255,105,160,0.45);
    transition:transform .2s ease, box-shadow .2s ease;
    letter-spacing:0.5px;
  }
  #openBtn:hover{
    transform:translateY(-3px) scale(1.04);
    box-shadow:0 12px 26px rgba(255,105,160,0.55);
  }
  #openBtn:active{transform:translateY(0) scale(0.98);}

  .icon-row{
    font-size:2rem;
    margin-top:18px;
    letter-spacing:8px;
  }

  /* ---------- Note screen ---------- */
  #noteScreen{
    display:none;
    position:relative;
    min-height:100vh;
    align-items:center;
    justify-content:center;
    padding:40px 16px 60px;
    z-index:2;
  }
  #noteScreen.show{display:flex;}

  .note-card{
    background:var(--cream);
    max-width:700px;
    width:100%;
    border-radius:24px;
    padding:clamp(24px,5vw,55px);
    box-shadow:0 20px 50px rgba(255,127,176,0.35), 0 0 0 6px #fff inset;
    position:relative;
    border:2px dashed var(--pink-mid);
    animation:cardIn .7s ease;
  }
  @keyframes cardIn{
    0%{opacity:0; transform:translateY(40px) scale(0.95);}
    100%{opacity:1; transform:translateY(0) scale(1);}
  }
  .note-card::before{
    content:"🍓";
    position:absolute;
    top:-22px;
    left:-18px;
    font-size:2.4rem;
    transform:rotate(-15deg);
  }
  .note-card::after{
    content:"💗";
    position:absolute;
    bottom:-18px;
    right:-10px;
    font-size:2.2rem;
    transform:rotate(12deg);
  }

  .note-header{
    text-align:center;
    color:var(--pink-deep);
    font-weight:800;
    font-size:clamp(1.6rem,5vw,2.4rem);
    margin:0 0 6px 0;
  }
  .note-sub{
    text-align:center;
    color:var(--pink-text);
    opacity:0.7;
    font-size:0.9rem;
    margin-bottom:20px;
  }

  #editableNote{
    width:100%;
    min-height:280px;
    border:none;
    outline:none;
    resize:vertical;
    background:transparent;
    color:#5c3a49;
    font-size:1.15rem;
    line-height:1.7;
    font-family:'Segoe UI', sans-serif;
    padding:10px 4px;
  }
  #editableNote:focus{
    background:rgba(255,214,232,0.25);
    border-radius:12px;
  }

  .toolbar{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
  }
  .toolbar button{
    border:1.5px solid var(--pink-deep);
    background:white;
    color:var(--pink-deep);
    padding:8px 16px;
    border-radius:30px;
    font-size:0.85rem;
    cursor:pointer;
    transition:all .2s ease;
  }
  .toolbar button:hover{
    background:var(--pink-deep);
    color:white;
  }

  .saved-msg{
    text-align:center;
    color:var(--pink-deep);
    font-size:0.85rem;
    margin-top:10px;
    height:16px;
    opacity:0;
    transition:opacity .3s ease;
  }
  .saved-msg.show{opacity:1;}

  .heart-divider{
    text-align:center;
    color:var(--pink-mid);
    margin:14px 0;
    letter-spacing:10px;
    font-size:1.1rem;
  }

  .next-btn-wrap{
    text-align:center;
    margin-top:24px;
  }
  #nextBtn{
    padding:13px 34px;
    font-size:1rem;
    border:none;
    border-radius:50px;
    background:linear-gradient(135deg,var(--pink-deep),#ff5c9e);
    color:white;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(255,105,160,0.4);
    transition:transform .2s ease;
  }
  #nextBtn:hover{transform:translateY(-2px) scale(1.03);}

  /* ---------- Gallery screen ---------- */
  #galleryScreen{
    display:none;
    position:relative;
    min-height:100vh;
    flex-direction:column;
    align-items:center;
    padding:50px 16px 80px;
    z-index:2;
  }
  #galleryScreen.show{display:flex;}

  #galleryScreen h2{
    color:var(--pink-deep);
    font-weight:800;
    font-size:clamp(1.8rem,5vw,2.6rem);
    margin-bottom:6px;
    text-align:center;
  }
  #galleryScreen .note-sub{margin-bottom:30px;}

  .upload-wrap{
    margin-bottom:50px;
  }
  #photoInput{display:none;}
  .upload-label{
    display:inline-block;
    padding:13px 30px;
    border:2px dashed var(--pink-deep);
    border-radius:30px;
    color:var(--pink-deep);
    background:rgba(255,255,255,0.6);
    cursor:pointer;
    font-size:0.95rem;
    transition:all .2s ease;
  }
  .upload-label:hover{
    background:var(--pink-deep);
    color:white;
  }

  .clothesline{
    position:relative;
    width:100%;
    max-width:1000px;
  }
  .line{
    width:100%;
    height:3px;
    background:linear-gradient(90deg, transparent, var(--pink-deep) 5%, var(--pink-deep) 95%, transparent);
    border-radius:2px;
    margin-bottom:0;
  }
  .photo-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:34px;
    margin-top:-4px;
    padding:0 10px;
  }
  .polaroid{
    background:white;
    padding:12px 12px 34px 12px;
    box-shadow:0 10px 25px rgba(150,60,100,0.25);
    width:160px;
    position:relative;
    animation:swing 4s ease-in-out infinite;
    transform-origin:top center;
  }
  .polaroid:nth-child(odd){animation-delay:0.3s; transform:rotate(-4deg);}
  .polaroid:nth-child(even){transform:rotate(3deg);}
  @keyframes swing{
    0%,100%{transform:rotate(-3deg);}
    50%{transform:rotate(3deg);}
  }
  .polaroid img{
    width:100%;
    height:150px;
    object-fit:cover;
    display:block;
  }
  .polaroid .pin{
    position:absolute;
    top:-14px;
    left:50%;
    transform:translateX(-50%);
    font-size:1.5rem;
  }
  .polaroid .remove-btn{
    position:absolute;
    bottom:6px;
    right:8px;
    background:none;
    border:none;
    color:#c98;
    font-size:0.75rem;
    cursor:pointer;
    opacity:0.6;
  }
  .polaroid .remove-btn:hover{opacity:1; color:var(--pink-deep);}
  .polaroid .cap{
    text-align:center;
    font-size:0.75rem;
    color:var(--pink-text);
    opacity:0.7;
    margin-top:6px;
  }

  .empty-state{
    color:var(--pink-text);
    opacity:0.55;
    font-size:0.95rem;
    margin-top:20px;
    text-align:center;
  }
</style>
</head>
<body>

<div id="fallers"></div>

<div id="intro">
  <h1>Happy 8 Months 💕</h1>
  <p>eight months of us, and counting...</p>
  <div class="icon-row">🍓 💗 🍓</div>
  <button id="openBtn">Open Your Note 💌</button>
</div>

<div id="noteScreen">
  <div class="note-card">
    <h2 class="note-header">To You 💖</h2>
    <div class="note-sub">tap below and write from the heart — it saves as you type</div>
    <div class="heart-divider">♡ ♡ ♡</div>
    <div id="editableNote" contenteditable="true" placeholder="Write your note here..."></div>
    <div class="toolbar">
      <button onclick="document.execCommand('bold')">Bold</button>
      <button onclick="document.execCommand('italic')">Italic</button>
      <button onclick="clearNote()">Clear</button>
    </div>
    <div class="saved-msg" id="savedMsg">saved ✓</div>
    <div class="next-btn-wrap">
      <button id="nextBtn">Next 🍓</button>
    </div>
  </div>
</div>

<div id="galleryScreen">
  <h2>Our Little Gallery 📸</h2>
  <div class="note-sub">a few of our favorite moments, hung up just for us</div>

  <div class="upload-wrap">
    <label class="upload-label" for="photoInput">+ Add a photo</label>
    <input type="file" id="photoInput" accept="image/*" multiple>
  </div>

  <div class="clothesline">
    <div class="line"></div>
    <div class="photo-row" id="photoRow"></div>
  </div>
  <div class="empty-state" id="emptyState">no photos yet — add your favorites above 🍓</div>
</div>

<script>
  // Open note screen
  document.getElementById('openBtn').addEventListener('click', function(){
    document.getElementById('intro').style.display = 'none';
    document.getElementById('noteScreen').classList.add('show');
  });

  // Go to gallery screen
  document.getElementById('nextBtn').addEventListener('click', function(){
    document.getElementById('noteScreen').classList.remove('show');
    document.getElementById('galleryScreen').classList.add('show');
    window.scrollTo(0,0);
  });

  function clearNote(){
    document.getElementById('editableNote').innerText = '';
    document.getElementById('editableNote').focus();
  }

  // fake "saved" indicator while typing
  let saveTimeout;
  document.getElementById('editableNote').addEventListener('input', function(){
    const msg = document.getElementById('savedMsg');
    clearTimeout(saveTimeout);
    msg.classList.remove('show');
    localStorage.setItem('eightMonthsNote', document.getElementById('editableNote').innerHTML);
    saveTimeout = setTimeout(()=>{ msg.classList.add('show'); }, 700);
  });

  // load saved note on page load
  window.addEventListener('DOMContentLoaded', function(){
    const savedNote = localStorage.getItem('eightMonthsNote');
    if(savedNote){
      document.getElementById('editableNote').innerHTML = savedNote;
    }
  });

  // ---------- Photo gallery ----------
  const photoInput = document.getElementById('photoInput');
  const photoRow = document.getElementById('photoRow');
  const emptyState = document.getElementById('emptyState');

  function updateEmptyState(){
    emptyState.style.display = photoRow.children.length ? 'none' : 'block';
  }

  function getSavedPhotos(){
    const raw = localStorage.getItem('eightMonthsPhotos');
    return raw ? JSON.parse(raw) : [];
  }

  function savePhotos(){
    const srcs = Array.from(photoRow.querySelectorAll('img')).map(img => img.src);
    localStorage.setItem('eightMonthsPhotos', JSON.stringify(srcs));
  }

  function addPolaroid(src){
    const p = document.createElement('div');
    p.className = 'polaroid';
    p.innerHTML = `
      <span class="pin">📌</span>
      <img src="${src}">
      <button class="remove-btn" title="remove">✕ remove</button>
    `;
    p.querySelector('.remove-btn').addEventListener('click', function(){
      p.remove();
      updateEmptyState();
      savePhotos();
    });
    photoRow.appendChild(p);
    updateEmptyState();
  }

  photoInput.addEventListener('change', function(e){
    const files = Array.from(e.target.files);
    files.forEach(file=>{
      const reader = new FileReader();
      reader.onload = function(ev){
        addPolaroid(ev.target.result);
        savePhotos();
      };
      reader.readAsDataURL(file);
    });
    photoInput.value = '';
  });

  // load saved photos on page load
  getSavedPhotos().forEach(src => addPolaroid(src));
  updateEmptyState();

  // ---------- Falling hearts & strawberries ----------
  const symbols = ['💗','🍓','💕','🍓','💖','🍓'];
  const container = document.getElementById('fallers');
  const count = 26;

  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'falling';
    el.textContent = symbols[Math.floor(Math.random()*symbols.length)];
    const size = 1 + Math.random()*1.6;
    el.style.fontSize = size + 'rem';
    el.style.left = Math.random()*100 + 'vw';
    const duration = 6 + Math.random()*9;
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = (-Math.random()*duration) + 's';
    el.style.opacity = 0.6 + Math.random()*0.4;
    container.appendChild(el);
  }
</script>

</body>
</html>
